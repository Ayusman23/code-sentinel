services:
  # Python FastAPI AI Worker Service
  - type: web
    name: codesentinel-ai-engine
    env: python
    region: oregon
    plan: starter
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
      - key: SECRET_ENTROPY_THRESHOLD
        value: "3.8"
      - key: ENABLE_FALLBACK_HEURISTICS
        value: "true"

  # Node.js Ingestion Gateway (Control Plane)
  - type: web
    name: codesentinel-backend
    env: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: AI_ENGINE_URL
        fromService:
          type: web
          name: codesentinel-ai-engine
          property: host
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # React Frontend Cyber Dashboard
  - type: web
    name: codesentinel-frontend
    env: static
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
