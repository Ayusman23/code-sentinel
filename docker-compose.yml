version: '3.8'

services:
  # MongoDB Atlas / Local Persistence
  mongodb:
    image: mongo:7.0
    container_name: codesentinel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: codesentinel
    volumes:
      - mongo_data:/data/db
    networks:
      - codesentinel-network

  # Python FastAPI AI Worker Plane
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: codesentinel-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-pro}
      - SECRET_ENTROPY_THRESHOLD=3.8
      - ENABLE_FALLBACK_HEURISTICS=true
    networks:
      - codesentinel-network

  # Node.js Ingestion Gateway (Control Plane)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesentinel-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/codesentinel
      - AI_ENGINE_URL=http://ai-engine:8000
      - AI_ENGINE_TIMEOUT_MS=3000
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-codesentinel_webhook_secret_2026}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - ai-engine
    networks:
      - codesentinel-network

  # React Cyber Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codesentinel-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - codesentinel-network

volumes:
  mongo_data:

networks:
  codesentinel-network:
    driver: bridge
