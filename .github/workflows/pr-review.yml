name: CodeSentinel Automated PR Reviewer Action

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  codesentinel-review:
    name: CodeSentinel AI DevSecOps Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CodeSentinel Core
        run: |
          pip install -r ai-engine/requirements.txt

      - name: Execute AST & Security Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'ai-engine')
          from app.core.secret_scrubber import SecretScrubber
          print('CodeSentinel Action initialized successfully for PR #' + str(os.getenv('PR_NUMBER')))
          "
